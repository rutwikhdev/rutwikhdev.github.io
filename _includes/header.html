<header class="site-header">

  <div class="wrap">

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}<span class="period">.</span></a>
    <div style="float:right;display: flex;justify-content: space-evenly;">
      <a style="margin-right: 10px;" class="navbar-link" href="{{ site.github }}">
        <img src="/assets/githubicon.svg" width="18">
      </a>
      <a style="margin-right: 10px;" class="navbar-link" href="{{ site.twitter }}">
        <img src="/assets/twittericon.svg" width="18">
      </a>
      <a style="margin-right: 10px;" class="navbar-link" href="{{ "/feed.xml" | prepend: site.baseurl }}">
        <img src="/assets/rssicon.svg" width="18">
      </a>
    </div>
  </div>

</header>
