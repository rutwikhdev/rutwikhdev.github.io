<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link href="/feed.xml" type="application/atom+xml" rel="alternate" title="{{ site.title }} posts" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔌</text></svg>">

    <!-- Local fonts -->
    <link rel="preload" href="{{ "/assets/fonts/inter-latin.woff2" | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ "/assets/fonts/space-grotesk-latin.woff2" | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ "/assets/fonts/jetbrains-mono-latin.woff2" | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>

    <!-- Critical CSS -->
    <style>{% include critical-css.html %}</style>

    <!-- Full CSS -->
    <link rel="preload" href="{{ "/css/main.css" | prepend: site.baseurl }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}"></noscript>
</head>
