---
layout: default
---

<div class="hero">
  <p>Outcome of letting my intrusive thoughts win...</p>
</div>

<ul class="posts">
  {% for post in site.posts %}
    <li>
      <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
      <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">
        {{ post.title }}
      </a>
    </li>
  {% endfor %}
</ul>
