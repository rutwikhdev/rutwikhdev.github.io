---
layout: default
---
<div id="wrapper">
  {% include back-link.html path="/" text=site.back_link_text %}

  <div class="section-title">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p>{{ page.subtitle }}</p>
    {% endif %}
  </div>

  <main class="layout-list">
    <div class="post-list">
      {% for post in site.posts %}
      <a class="post instant" href="{{ post.url | prepend: site.baseurl }}">
        <span>{{ post.title }}</span>
        <span class="date">{{ post.date | date: site.date_format }}</span>
      </a>
      {% endfor %}
    </div>
  </main>

  {% include footer.html %}
</div>
