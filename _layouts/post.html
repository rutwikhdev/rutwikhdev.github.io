---
layout: post-full
---
{% assign word_count = page.content
   | strip_html
   | replace_regex: '\s+', ' '
   | strip
   | split: ' '
   | size %}

<div class="newspaper-container">

  <article class="newspaper-article post-newspaper">

    <header class="article-header">
      <h1 class="headline">{{ page.title }}</h1>
      <div class="byline">
        <span class="byline-author">By Rutwik Hiwalkar</span>
        <span class="byline-separator">|</span>
        <span class="byline-date">{{ word_count }} words</span>
      </div>
    </header>

    <div class="post-content-newspaper">
      {{ content }}
    </div>

  </article>

</div>

<!-- mathjax -->
{% if page.mathjax %}
<script type="text/javascript" src="//cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
{% endif %}
